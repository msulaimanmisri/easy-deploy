name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: "Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 12 line uses Testbench 10
          - laravel: "12.*"
            testbench: "^10.0"
            php: "8.1"
          - laravel: "12.*"
            testbench: "^10.0"
            php: "8.2"
          - laravel: "12.*"
            testbench: "^10.0"
            php: "8.3"
          - laravel: "12.*"
            testbench: "^10.0"
            php: "8.4"
          # Laravel 13 line uses Testbench 11 (requires PHP 8.3+)
          - laravel: "13.*"
            testbench: "^11.0"
            php: "8.3"
          - laravel: "13.*"
            testbench: "^11.0"
            php: "8.4"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: dependencies-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            dependencies-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-composer-
            dependencies-laravel-${{ matrix.laravel }}-

      - name: Pin Testbench to the Laravel line under test
        run: |
          composer require --no-update --dev "orchestra/testbench:${{ matrix.testbench }}"
          composer require --no-update \
            "illuminate/console:${{ matrix.laravel }}" \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}" \
            "illuminate/routing:${{ matrix.laravel }}" \
            "illuminate/events:${{ matrix.laravel }}" \
            "illuminate/filesystem:${{ matrix.laravel }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: composer test
